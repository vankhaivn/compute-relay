[build-system]
requires = ["uv_build==0.12.13"]
build-backend = "uv_build"

[project]
name = "compute-relay-kaggle-probe"
version = "0.1.0"
description = "Credential-free inventory and subprocess safety harness for the Compute Relay Kaggle adapter"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "kaggle==2.2.4",
  "kagglesdk==0.1.35",
]

[project.scripts]
compute-relay-kaggle-probe = "compute_relay_kaggle_probe.cli:main"

[tool.uv]
required-version = "==0.12.13"
package = true
