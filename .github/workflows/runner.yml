name: Runner offline

on:
  pull_request:
    paths:
      - "runner/**"
      - "internal/contracts/**"
      - "api/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/runner.yml"
  push:
    branches: [main]
    paths:
      - "runner/**"
      - "internal/contracts/**"
      - "api/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/runner.yml"

permissions:
  contents: read

jobs:
  offline:
    name: Linux CPU fixtures and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CR_RUNNER_RESULTS_DIR: ${{ runner.temp }}/runner-result-contracts
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pinned Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          python-version: "3.11.16"
          enable-cache: false
      - name: Check syntax, asset lock, and synthetic runner units
        run: |
          uv run --no-project --python 3.11.16 python -c "import platform; assert platform.python_version() == '3.11.16'"
          uv run --no-project --python 3.11.16 python runner/check.py
      - name: Set up repository Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.1"
          cache: false
      - name: Validate actual runner result bytes against public schemas
        run: go test ./internal/contracts -run TestRunner -count=1
