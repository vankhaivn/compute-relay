name: Finite RTMPS example

on:
  pull_request:
    paths:
      - "examples/finite-rtmps/**"
      - "internal/packaging/**"
      - "internal/bundlectl/**"
      - ".github/workflows/finite-rtmps.yml"
  push:
    branches: [main]
    paths:
      - "examples/finite-rtmps/**"
      - "internal/packaging/**"
      - "internal/bundlectl/**"
      - ".github/workflows/finite-rtmps.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline:
    name: Offline media watchdog and public client
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up pinned Python
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.13"
          python-version: "3.11.16"
          enable-cache: false
      - name: Check synthetic example fixtures
        run: |
          uv run --no-project --python 3.11.16 python -c "import platform; assert platform.python_version() == '3.11.16'"
          uv run --no-project --python 3.11.16 python examples/finite-rtmps/check.py
