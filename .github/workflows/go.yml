name: Go

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "**/*.go"
      - "internal/store/sqlite/migrations/**"
      - "internal/**/*.py"
      - "internal/provider/sshhost/image/**"
      - "internal/devtool/fault-matrix.json"
      - "runner/**"
      - "api/**"
      - "go.mod"
      - "go.sum"
      - "scripts/dev.*"
      - ".github/workflows/go.yml"
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "internal/store/sqlite/migrations/**"
      - "internal/**/*.py"
      - "internal/provider/sshhost/image/**"
      - "internal/devtool/fault-matrix.json"
      - "runner/**"
      - "api/**"
      - "go.mod"
      - "go.sum"
      - "scripts/dev.*"
      - ".github/workflows/go.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.27.1"

jobs:
  quality:
    name: Linux checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            .github/workflows/go.yml
            ${{ github.event_name == 'workflow_dispatch' && 'go.mod' || '' }}

      - name: Verify toolchain
        shell: bash
        run: test "$(go env GOVERSION)" = "go${GO_VERSION}"

      - name: Run repository checks
        run: go run ./cmd/devtool check

      - name: Run race tests
        if: github.event_name == 'workflow_dispatch'
        run: go run ./cmd/devtool test-race

  native:
    name: Native macOS
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run native tests
        run: go run ./cmd/devtool test

      - name: Build without CGo
        run: go run ./cmd/devtool build
