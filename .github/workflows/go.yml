name: Go

on:
  pull_request:
    paths:
      - "**/*.go"
      - "internal/store/sqlite/migrations/**"
      - "internal/**/*.py"
      - "internal/provider/sshhost/image/**"
      - "internal/devtool/fault-matrix.json"
      - "runner/**"
      - ".github/scripts/**"
      - "api/**"
      - "go.mod"
      - "go.sum"
      - "scripts/dev.*"
      - ".github/workflows/go.yml"
  push:
    branches: [main]
    paths:
      - "**/*.go"
      - "internal/store/sqlite/migrations/**"
      - "internal/**/*.py"
      - "internal/provider/sshhost/image/**"
      - "internal/devtool/fault-matrix.json"
      - "runner/**"
      - ".github/scripts/**"
      - "api/**"
      - "go.mod"
      - "go.sum"
      - "scripts/dev.*"
      - ".github/workflows/go.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GO_VERSION: "1.27.1"

jobs:
  scope:
    name: Select Go checks
    runs-on: ubuntu-latest
    outputs:
      race: ${{ steps.scope.outputs.race }}
      macos: ${{ steps.scope.outputs.macos }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Test check selection
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Select extra checks
        id: scope
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 .github/scripts/ci_scope.py

  quality:
    name: Linux checks
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            .github/workflows/go.yml
            ${{ needs.scope.outputs.race == 'true' && '.github/scripts/ci_scope.py' || '' }}

      - name: Verify toolchain
        shell: bash
        run: test "$(go env GOVERSION)" = "go${GO_VERSION}"

      - name: Run repository checks
        run: go run ./cmd/devtool check

      - name: Run race tests
        if: needs.scope.outputs.race == 'true'
        run: go run ./cmd/devtool test-race

  native:
    name: Native macOS
    needs: scope
    if: needs.scope.outputs.macos == 'true'
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Run native tests
        run: go run ./cmd/devtool test

      - name: Build without CGo
        run: go run ./cmd/devtool build
